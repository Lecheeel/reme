publish_to: 'none'

version: 2.3.0+10

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0
  fl_chart: ^1.2.0
  package_info_plus: ^10.2.1
